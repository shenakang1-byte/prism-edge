<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>飞剑守村</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2f5a22;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#wrap{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pill{position:absolute;background:rgba(30,40,30,.62);color:#fff;font-weight:900;border-radius:22px;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;font-size:17px;text-shadow:0 2px 0 #0008;border:2px solid #0004}
.ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;border:2px solid #3a2a10;box-shadow:inset 0 -3px 0 #0003}
#wavePill{left:10px;top:calc(10px + env(safe-area-inset-top))}
#coinPill{left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top))}
#lives{position:absolute;left:14px;top:calc(52px + env(safe-area-inset-top));font-size:17px;letter-spacing:1px;filter:drop-shadow(0 2px 0 #0006)}
#setBtn{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;background:rgba(30,40,30,.62);color:#fff;font-size:24px;display:grid;place-items:center;border:2px solid #0004}
#swPill{left:10px;bottom:calc(16px + env(safe-area-inset-bottom))}
#adBtn{position:absolute;left:56%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#ffe35a,#ffb800);color:#5a3200;font-weight:900;font-size:18px;border:3px solid #7a4a00;border-radius:16px;padding:10px 16px;box-shadow:0 5px 0 #a86a00,0 8px 12px #0005;white-space:nowrap}
#adBtn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #a86a00}
#adBtn.pulse{animation:pu .7s infinite}
@keyframes pu{50%{transform:translateX(-50%) scale(1.08)}}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,25,10,.55);z-index:5;color:#fff;text-align:center}
.ov.on{display:flex}
.card{background:#fff8e6;color:#4a3010;border:4px solid #6b4a1a;border-radius:22px;padding:22px 26px;box-shadow:0 8px 0 #6b4a1a,0 14px 30px #0006;min-width:270px}
.card h2{margin:0 0 8px;font-size:28px}
.btn{display:block;width:100%;margin-top:12px;font-weight:900;font-size:19px;border-radius:14px;padding:11px;border:3px solid #24510f;background:linear-gradient(#8ee04a,#4caf1e);color:#fff;text-shadow:0 2px 0 #0005;box-shadow:0 4px 0 #24510f}
.btn.y{background:linear-gradient(#ffe35a,#ffb800);color:#5a3200;border-color:#7a4a00;box-shadow:0 4px 0 #7a4a00;text-shadow:none}
.btn.g{background:#ddd;color:#555;border-color:#999;box-shadow:0 4px 0 #999;text-shadow:none}
#home{background:url(assets/bg.jpg) center/cover}
#home .t{font-size:52px;font-weight:900;color:#fff6c8;-webkit-text-stroke:3px #5a3200;text-shadow:0 6px 0 #5a3200,0 10px 20px #0007;margin-bottom:4px}
#home .s{font-weight:800;background:#0006;border-radius:12px;padding:4px 12px;margin-bottom:16px}
#home img{width:150px;filter:drop-shadow(0 6px 4px #0006)}
#toast{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:2px #5a3200;text-shadow:0 4px 0 #5a3200;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;z-index:4}
#adov{z-index:9;background:#000d;font-size:20px;font-weight:800}
.rule{font-size:14px;text-align:left;line-height:1.6;margin:6px 0}
</style></head><body><div id="wrap">
<canvas id="cv"></canvas>
<div class="pill" id="wavePill"><span class="ico" style="background:#3cb3ff">🌊</span><span id="waveT">第 1 波</span></div>
<div class="pill" id="coinPill"><span class="ico" style="background:#ffc21a">★</span><span id="coinT">0</span></div>
<div id="lives"></div>
<div id="setBtn">⚙</div>
<div class="pill" id="swPill"><span style="font-size:20px">🗡️</span><span id="swT">剩余 0</span></div>
<div id="adBtn">观看广告 +6飞剑</div>
<div id="toast"></div>
<div class="ov on" id="home"><img src="assets/hero.png"><div class="t">飞剑守村</div><div class="s">点飞剑·按箭头方向出鞘·守住村口</div>
<div class="card" style="min-width:290px"><div class="rule">① 每把飞剑带<b>方向箭头</b>，点它就沿箭头飞出<br>② 路线上有别的剑挡着会<b>受阻</b>（怪物趁机前进）<br>③ <b>↑</b>剑打上方路、<b>→</b>剑打右侧路，命中当段怪物<b>伤害×2</b><br>④ ←↓剑弹射追踪，伤害减半——先后顺序就是策略</div>
<div class="btn" id="startBtn">开始守村</div><div id="best" style="margin-top:10px;font-weight:800"></div></div></div>
<div class="ov" id="menu"><div class="card"><h2>暂停</h2><div class="btn" id="resume">继续</div><div class="btn g" id="restart">重新开始</div><div class="btn g" id="toHome">回到首页</div></div></div>
<div class="ov" id="over"><div class="card"><h2 id="overT">村口失守！</h2><div id="overS"></div><div class="btn y" id="revBtn">看广告复活（+3❤ +6剑）</div><div class="btn" id="again">再来一局</div></div></div>
<div class="ov" id="adov"><div>📺 广告播放中…</div><div id="adCnt" style="font-size:48px;margin-top:10px">3</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
let W,H,DPR,L={};
const IMG={};['bg.jpg','mush.png','golem.png','jelly.png','boss.png','hero.png'].forEach(n=>{const i=new Image();i.src='assets/'+n;IMG[n.split('.')[0]]=i;});
const WHITE={};
function whiteOf(k){if(WHITE[k])return WHITE[k];const i=IMG[k];if(!i.complete||!i.width)return null;const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const g=c.getContext('2d');g.drawImage(i,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);return WHITE[k]=c;}
// dir: 0 up 1 right 2 down 3 left
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const COL=[['#ffe14a','#ff9d00','#fff7b0'],['#45b8ff','#1460e0','#c8f0ff'],['#c77dff','#7a2ee0','#f0d8ff'],['#8ef04a','#2fa018','#e0ffc0']];
const SWC={};
function swordCanvas(d){if(SWC[d])return SWC[d];const s=128,c=document.createElement('canvas');c.width=s;c.height=s*2;const g=c.getContext('2d');const [m,dk,lt]=COL[d];
 g.translate(s/2,s);g.shadowColor=m;g.shadowBlur=22;
 const path=()=>{g.beginPath();g.moveTo(0,-108);g.lineTo(17,-80);g.lineTo(15,30);g.lineTo(-15,30);g.lineTo(-17,-80);g.closePath();};
 g.lineWidth=9;g.strokeStyle='#1a1a2a';path();g.stroke();g.shadowBlur=0;
 const gr=g.createLinearGradient(-17,0,17,0);gr.addColorStop(0,dk);gr.addColorStop(.45,lt);gr.addColorStop(.55,m);gr.addColorStop(1,dk);g.fillStyle=gr;path();g.fill();
 // guard
 g.lineWidth=7;g.strokeStyle='#1a1a2a';g.fillStyle=dk;g.beginPath();g.roundRect?g.roundRect(-40,28,80,20,9):g.rect(-40,28,80,20);g.stroke();g.fill();
 g.fillStyle=m;g.beginPath();g.arc(0,38,12,0,7);g.fill();g.stroke();
 g.fillStyle='#6b3d14';g.fillRect(-8,48,16,36);g.strokeRect(-8,48,16,36);
 g.fillStyle=m;g.beginPath();g.arc(0,92,11,0,7);g.fill();g.stroke();
 // arrow
 g.fillStyle='#fff';g.strokeStyle='#1a1a2a';g.lineWidth=3;g.beginPath();g.moveTo(0,-78);g.lineTo(13,-52);g.lineTo(5,-52);g.lineTo(5,14);g.lineTo(-5,14);g.lineTo(-5,-52);g.lineTo(-13,-52);g.closePath();g.fill();g.stroke();
 return SWC[d]=c;}
function resize(){const r=$('wrap').getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(2.5,devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;
 L.ty=H*0.236;L.rx=W*0.85;L.gy=H*0.86;L.pw=W*0.13;
 L.cols=5;L.rows=6;const gx0=W*0.035,gx1=L.rx-L.pw*0.75,gy0=L.ty+L.pw*0.75,gy1=H*0.875;
 L.cs=Math.min((gx1-gx0)/L.cols,(gy1-gy0)/L.rows);L.gx=gx0+((gx1-gx0)-L.cs*L.cols)/2;L.gy0=gy0+((gy1-gy0)-L.cs*L.rows)/2;
 L.seg1=L.rx+40;L.len=L.seg1+(L.gy-L.ty);}
addEventListener('resize',resize);resize();
function pathPos(s){if(s<L.seg1)return[s-40,L.ty];return[L.rx,L.ty+(s-L.seg1)];}
function cellXY(c,r){return[L.gx+(c+.5)*L.cs,L.gy0+(r+.5)*L.cs];}
// ---------- state
let G=null,best=+(safeGet('fj_best')||0);
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const ETYPE={mush:{hp:2,sp:1,sz:.95,coin:2},jelly:{hp:3,sp:.85,sz:.95,coin:3},golem:{hp:6,sp:.6,sz:1.15,coin:5},boss:{hp:30,sp:.4,sz:1.9,coin:50}};
function rnd(a,b){return a+Math.random()*(b-a)}
function genGrid(wave){// reverse build: each added sword must have clear path vs. already-placed swords => always solvable
 const R=L.rows,C=L.cols,g=[];for(let r=0;r<R;r++)g.push(Array(C).fill(-1));
 const pGood=Math.max(.42,.78-wave*.035);// chance to face enemies (up/right)
 const fill=Math.min(1,.7+wave*.05);
 const cells=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)cells.push([c,r]);
 // add order: prefer cells far from exits first for deep dependency chains at higher waves
 cells.sort(()=>Math.random()-.5);
 if(wave>2)cells.sort((a,b)=>(b[1]-a[0])-(a[1]-b[0])+rnd(-3,3));
 let n=0;for(const [c,r] of cells){if(Math.random()>fill)continue;
  let opts=[0,1,2,3].filter(d=>clearPath(g,c,r,d));if(!opts.length)continue;
  const good=opts.filter(d=>d<2),bad=opts.filter(d=>d>=2);
  // deliberate blocking: harder waves prefer good dirs that will be blocked later
  let d=(good.length&&(Math.random()<pGood||!bad.length))?good[Math.random()*good.length|0]:bad[Math.random()*bad.length|0];
  g[r][c]=d;n++;}
 return g;}
function clearPath(g,c,r,d){let x=c+DX[d],y=r+DY[d];while(x>=0&&y>=0&&x<L.cols&&y<L.rows){if(g[y][x]>=0)return false;x+=DX[d];y+=DY[d];}return true;}
function blocker(g,c,r,d){let x=c+DX[d],y=r+DY[d];while(x>=0&&y>=0&&x<L.cols&&y<L.rows){if(g[y][x]>=0)return[x,y];x+=DX[d];y+=DY[d];}return null;}
function solveCheck(g){const h=g.map(r=>r.slice());let left=h.flat().filter(v=>v>=0).length,prog=true;while(prog){prog=false;for(let r=0;r<L.rows;r++)for(let c=0;c<L.cols;c++)if(h[r][c]>=0&&clearPath(h,c,r,h[r][c])){h[r][c]=-1;left--;prog=true;}}return left===0;}
function newGame(){G={wave:0,coins:0,lives:5,revived:false,en:[],pr:[],fx:[],nums:[],shake:0,combo:0,lastHit:0,t:0,over:false,spawnQ:[],grid:null,sw:[],misplay:0,kills:0};nextWave();}
function nextWave(){G.wave++;G.grid=genGrid(G.wave);if(!solveCheck(G.grid))console.error('unsolvable');
 G.sw=[];for(let r=0;r<L.rows;r++)for(let c=0;c<L.cols;c++)G.sw.push({c,r,a:0,ox:0,oy:0,fl:0,pop:Math.random()*.3});
 const nSw=G.grid.flat().filter(v=>v>=0).length;
 // HP budget: precise hit=2; ramps so you need mostly precise shots
 let budget=Math.round(nSw*(1.25+Math.min(.55,G.wave*.06)));
 const q=[];const boss=G.wave%5===0;if(boss){const hp=Math.round(budget*.45);q.push({k:'boss',hp});budget-=hp;}
 while(budget>0){let k=Math.random()<.5?'mush':(Math.random()<.55||G.wave<2?'jelly':'golem');let hp=ETYPE[k].hp+Math.floor(G.wave/4);if(hp>budget){k='mush';hp=budget;}q.push({k,hp});budget-=hp;}
 if(boss){const b=q.shift();q.splice(Math.floor(q.length*.4),0,b);}
 const gap=Math.max(1.1,2.6-G.wave*.12);G.spawnQ=q.map((e,i)=>({...e,at:G.t+1.2+i*gap}));G.total=q.length;
 G.speedMul=Math.min(1.9,.9+G.wave*.07);
 toast(boss?'⚠ 第'+G.wave+'波 · 甲虫魔王来袭':'第 '+G.wave+' 波',1400);ui();}
function cnt(){return G.grid.flat().filter(v=>v>=0).length}
function ui(){if(!G)return;$('waveT').textContent='第 '+G.wave+' 波';$('coinT').textContent=G.coins;$('swT').textContent='剩余 '+cnt();
 $('lives').textContent='❤'.repeat(Math.max(0,G.lives))+'🤍'.repeat(Math.max(0,5-G.lives));$('adBtn').classList.toggle('pulse',cnt()<=3&&G.en.length+G.spawnQ.length>0);}
let toastT;function toast(s,ms=900,col){const t=$('toast');t.textContent=s;t.style.color=col||'#fff';t.style.opacity=1;t.style.transform='scale(1.1)';setTimeout(()=>t.style.transform='scale(1)',120);clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,ms);}
// ---------- input
cv.addEventListener('pointerdown',e=>{if(!G||G.over||paused)return;const b=cv.getBoundingClientRect();const x=e.clientX-b.left,y=e.clientY-b.top;
 const c=Math.floor((x-L.gx)/L.cs),r=Math.floor((y-L.gy0)/L.cs);if(c<0||r<0||c>=L.cols||r>=L.rows)return;const d=G.grid[r][c];if(d<0)return;
 const s=G.sw.find(s=>s.c===c&&s.r===r);const bl=blocker(G.grid,c,r,d);
 if(bl){// blocked: bump toward blocker, shake, enemies advance
  s.bump=0.001;s.bd=d;s.bdist=(Math.abs(bl[0]-c)+Math.abs(bl[1]-r)-.55)*L.cs;const bs=G.sw.find(q=>q.c===bl[0]&&q.r===bl[1]);bs.fl=.5;bs.jit=.35;
  G.combo=0;G.misplay++;G.shake=Math.max(G.shake,5);for(const en of G.en)en.s+=L.cs*.35;toast('受阻！怪物前进',700,'#ffb0a0');return;}
 G.grid[r][c]=-1;const [px,py]=cellXY(c,r);
 const precise=d<2;const tgt=pickTarget(d,px,py);
 G.pr.push({x:px,y:py,d,vx:DX[d],vy:DY[d],sp:W*2.2,t:0,tr:[],tgt,precise,phase:0});
 for(let i=0;i<8;i++)G.fx.push({x:px,y:py,vx:rnd(-80,80),vy:rnd(-80,80),l:.4,ml:.4,c:COL[d][0],r:rnd(2,5)});
 ui();});
function onTop(en){return en.s<L.seg1}
function pickTarget(d,px,py){let best=null,bd=1e9;for(const en of G.en){if(en.hp<=0)continue;const [ex,ey]=pathPos(en.s);let sc;
  if(d===0)sc=onTop(en)?Math.abs(ex-px):1e5-en.s; else if(d===1)sc=!onTop(en)?Math.abs(ey-py):1e5-en.s; else sc=1e5-en.s;
  if(sc<bd){bd=sc;best=en;}}return best;}
// ---------- loop
let last=performance.now(),paused=false;
function step(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(G&&!paused&&!G.over)update(dt);draw();requestAnimationFrame(step);}
function update(dt){G.t+=dt;
 while(G.spawnQ.length&&G.spawnQ[0].at<=G.t){const q=G.spawnQ.shift();G.en.push({k:q.k,hp:q.hp,mhp:q.hp,s:0,ph:Math.random()*6,hf:0,kb:0});}
 const base=L.len/24;
 for(const en of G.en){en.s+=base*ETYPE[en.k].sp*G.speedMul*dt*(en.kb>0?.2:1);en.kb-=dt;en.ph+=dt*8*ETYPE[en.k].sp;en.hf-=dt;
  if(en.s>=L.len&&en.hp>0){en.hp=0;en.gone=1;const loss=en.k==='boss'?3:1;G.lives-=loss;G.shake=12;toast('村口受损 -'+loss+'❤',900,'#ff8070');G.heroHit=.5;}}
 G.en=G.en.filter(e=>e.hp>0||e.dead>0);for(const e of G.en)if(e.hp<=0)e.dead-=dt;
 for(const p of G.pr){p.t+=dt;p.tr.push([p.x,p.y]);if(p.tr.length>14)p.tr.shift();
  if(p.tgt&&p.tgt.hp<=0)p.tgt=pickTarget(p.d,p.x,p.y);
  const outGrid=p.x<L.gx-L.cs*.2||p.x>L.gx+L.cs*L.cols+L.cs*.2||p.y<L.gy0-L.cs*.2||p.y>L.gy0+L.cs*L.rows+L.cs*.2;
  if(outGrid&&!p.phase){p.phase=1;if(!p.precise){p.vx=-p.vx*.3+(p.d===3?0:.6);p.vy=-p.vy*.3+(p.d===2?-.6:0);for(let i=0;i<8;i++)G.fx.push({x:p.x,y:p.y,vx:rnd(-120,120),vy:rnd(-120,120),l:.3,ml:.3,c:'#fff',r:3});}}
  if(!p.tgt||p.tgt.hp<=0)p.tgt=pickTarget(p.d,p.x,p.y);
  if(p.phase)p.life=(p.life||0)+dt;
  if(p.phase&&p.tgt){const [ex,ey]=pathPos(p.tgt.s);const ax=ex-p.x,ay=ey-p.y,dl=Math.hypot(ax,ay)||1;const k=Math.min(1,dt*(p.precise?14:9+p.life*20));p.vx+=(ax/dl-p.vx)*k;p.vy+=(ay/dl-p.vy)*k;const n=Math.hypot(p.vx,p.vy);p.vx/=n;p.vy/=n;
   if(dl<L.cs*.5){hit(p);p.done=1;}}
  p.x+=p.vx*p.sp*dt;p.y+=p.vy*p.sp*dt;if(p.x<-30||p.x>W+30||p.y<-30||p.y>H+30){if(p.tgt){p.x=Math.max(-30,Math.min(W+30,p.x));p.y=Math.max(-30,Math.min(H+30,p.y));}else p.done=1;}
  if(!p.tgt&&!G.en.length&&!G.spawnQ.length)p.done=1; if(!p.tgt&&G.spawnQ.length&&p.phase){p.vx*=.9;p.vy*=.9;const n=Math.hypot(p.vx,p.vy)||1;p.vx/=n;p.vy/=n;}}
 G.pr=G.pr.filter(p=>!p.done);
 for(const f of G.fx){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=f.g?f.g*dt:0;}G.fx=G.fx.filter(f=>f.l>0);
 for(const n of G.nums){n.l-=dt;n.y-=40*dt;}G.nums=G.nums.filter(n=>n.l>0);
 for(const s of G.sw){if(s.bump){s.bump+=dt;if(s.bump>.3)s.bump=0;}s.fl-=dt;s.jit=(s.jit||0)-dt;}
 G.shake=Math.max(0,G.shake-dt*30);G.heroHit=(G.heroHit||0)-dt;
 if(G.lives<=0)return gameOver();
 if(!G.en.length&&!G.spawnQ.length&&!G.pr.length&&!G.clearing){G.clearing=1;const bonus=cnt()*5;G.coins+=10+bonus;toast('第'+G.wave+'波 守住！'+(bonus?' 剩剑+'+bonus+'金':''),1300,'#fff3a0');setTimeout(()=>{G.clearing=0;nextWave();},1500);}
 ui();}
function hit(p){const en=p.tgt;const segOk=p.precise&&((p.d===0&&onTop(en))||(p.d===1&&!onTop(en)));
 if(G.t-G.lastHit<1.6)G.combo++;else G.combo=1;G.lastHit=G.t;
 let dmg=segOk?2:1;if(G.combo>=5)dmg+=1;
 en.hp-=dmg;en.hf=.12;en.kb=.15;const [ex,ey]=pathPos(en.s);
 G.nums.push({x:ex+rnd(-10,10),y:ey-30,t:'-'+dmg,l:.8,c:segOk?'#ffe14a':'#ffffff',big:segOk});
 if(G.combo>=3)G.nums.push({x:ex,y:ey-58,t:'连击×'+G.combo,l:.9,c:'#ff7ad0',big:1});
 G.shake=Math.max(G.shake,segOk?4:2);
 for(let i=0;i<14;i++){const a=rnd(0,6.3),v=rnd(80,260);G.fx.push({x:ex,y:ey,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.35,ml:.35,c:i%2?COL[p.d][0]:'#fff',r:rnd(2,5)});}
 G.fx.push({ring:1,x:ex,y:ey,l:.25,ml:.25,c:COL[p.d][0]});
 if(en.hp<=0){en.dead=.35;G.kills++;const c=ETYPE[en.k].coin;G.coins+=c;G.shake=Math.max(G.shake,en.k==='boss'?16:6);
  for(let i=0;i<Math.min(8,c);i++)G.fx.push({coin:1,x:ex,y:ey,vx:rnd(-120,120),vy:rnd(-260,-120),g:600,l:.7,ml:.7,r:7});
  G.nums.push({x:ex,y:ey-80,t:'+'+c+'★',l:.9,c:'#ffd23a',big:1});
  if(en.k==='boss')toast('击败甲虫魔王！',1200,'#fff3a0');}}
// ---------- draw
function draw(){cx.setTransform(DPR,0,0,DPR,0,0);const sh=G?G.shake:0;cx.translate(rnd(-sh,sh)*.6,rnd(-sh,sh)*.6);
 if(IMG.bg.complete)cx.drawImage(IMG.bg,-8,-8,W+16,H+16);
 if(!G)return;
 // grid slots
 for(const s of G.sw){const [x,y]=cellXY(s.c,s.r);cx.fillStyle='rgba(40,70,20,.18)';cx.beginPath();cx.ellipse(x,y+L.cs*.38,L.cs*.22,L.cs*.07,0,0,7);cx.fill();}
 const t=performance.now()/1000;
 for(const s of G.sw){const d=G.grid[s.r][s.c];if(d<0)continue;let [x,y]=cellXY(s.c,s.r);
  if(s.bump){const k=Math.sin(Math.min(1,s.bump/.3)*Math.PI);x+=DX[s.bd]*s.bdist*k*.6;y+=DY[s.bd]*s.bdist*k*.6;}
  if(s.jit>0){x+=rnd(-3,3);y+=rnd(-3,3);}
  const fl=Math.sin(t*2.2+s.c*.7+s.r*1.1)*2;
  drawSword(x,y+fl,d,L.cs*1.18,1);
  if(s.fl>0){cx.globalCompositeOperation='lighter';cx.globalAlpha=s.fl*1.6;cx.fillStyle='#ff3020';cx.beginPath();cx.arc(x,y,L.cs*.42,0,7);cx.fill();cx.globalAlpha=1;cx.globalCompositeOperation='source-over';}}
 // enemies (draw sorted by y)
 const es=[...G.en].sort((a,b)=>pathPos(a.s)[1]-pathPos(b.s)[1]);
 for(const en of es){const [x,y]=pathPos(en.s);const T=ETYPE[en.k];const sz=L.pw*T.sz*1.05;const im=IMG[en.k];if(!im.complete)continue;
  const bounce=Math.abs(Math.sin(en.ph));const sq=1+(.5-bounce)*.12;let a=1,sc=1;if(en.hp<=0){a=Math.max(0,en.dead/.35);sc=1+(1-a)*.4;}
  const w=sz*sc/sq,h=sz*(im.height/im.width)*sc*sq;const yy=y-bounce*sz*.08;
  cx.globalAlpha=a*.35;cx.fillStyle='#000';cx.beginPath();cx.ellipse(x,y+sz*.32,sz*.36,sz*.1,0,0,7);cx.fill();cx.globalAlpha=a;
  const flip=!onTop(en);cx.save();cx.translate(x,yy);if(en.k==='boss'&&en.hf>0)cx.translate(rnd(-3,3),0);
  cx.drawImage(im,-w/2,-h*.62,w,h);
  if(en.hf>0){const wi=whiteOf(en.k);if(wi){cx.globalAlpha=Math.min(1,en.hf*8)*.85;cx.drawImage(wi,-w/2,-h*.62,w,h);}}
  cx.restore();cx.globalAlpha=1;
  if(en.hp>0&&(en.k==='boss'||en.hp<en.mhp)){const bw=en.k==='boss'?sz*1.0:sz*.7,by=yy-h*.62-(en.k==='boss'?16:6);
   if(en.k==='boss'){cx.font='900 13px sans-serif';cx.fillStyle='#fff';cx.strokeStyle='#000';cx.lineWidth=3;cx.textAlign='center';cx.strokeText('HP '+en.hp,x,by-5);cx.fillText('HP '+en.hp,x,by-5);}
   cx.fillStyle='#200';rr(x-bw/2-2,by-2,bw+4,10,5);cx.fill();cx.fillStyle=en.k==='boss'?'#ff3030':'#ff5040';rr(x-bw/2,by,bw*Math.max(0,en.hp/en.mhp),6,3);cx.fill();}}
 // hero at gate
 if(IMG.hero.complete){const hw=L.pw*1.25,hh=hw*IMG.hero.height/IMG.hero.width;const hx=L.rx-hw*.15,hy=H*.91+Math.sin(t*3)*1.5;cx.save();cx.translate(hx,hy);if(G.heroHit>0)cx.translate(rnd(-4,4),0);cx.drawImage(IMG.hero,-hw/2,-hh,hw,hh);cx.restore();}
 // projectiles
 cx.globalCompositeOperation='lighter';
 for(const p of G.pr){const c=COL[p.d];for(let i=1;i<p.tr.length;i++){const k=i/p.tr.length;cx.strokeStyle=c[0];cx.globalAlpha=k*.8;cx.lineWidth=L.cs*.22*k;cx.lineCap='round';cx.beginPath();cx.moveTo(...p.tr[i-1]);cx.lineTo(...p.tr[i]);cx.stroke();}
  cx.globalAlpha=.9;cx.strokeStyle='#fff';cx.lineWidth=3;if(p.tr.length>3){cx.beginPath();cx.moveTo(...p.tr[p.tr.length-4]);cx.lineTo(p.x,p.y);cx.stroke();}}
 cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
 for(const p of G.pr){const ang=Math.atan2(p.vy,p.vx)+Math.PI/2;drawSword(p.x,p.y,p.d,L.cs*1.1,0,ang);}
 // fx
 for(const f of G.fx){const k=f.l/f.ml;cx.globalAlpha=k;
  if(f.ring){cx.strokeStyle=f.c;cx.lineWidth=6*k;cx.beginPath();cx.arc(f.x,f.y,L.cs*(1.1-k)*.9+6,0,7);cx.stroke();}
  else if(f.coin){cx.fillStyle='#ffc21a';cx.strokeStyle='#7a4a00';cx.lineWidth=2;cx.beginPath();cx.ellipse(f.x,f.y,f.r*Math.abs(Math.cos(f.l*12)),f.r,0,0,7);cx.fill();cx.stroke();}
  else{cx.fillStyle=f.c;cx.beginPath();cx.arc(f.x,f.y,f.r*k+1,0,7);cx.fill();}}
 cx.globalAlpha=1;cx.textAlign='center';
 for(const n of G.nums){const k=n.l;cx.globalAlpha=Math.min(1,k*2);const s=(n.big?26:20)*(1+Math.max(0,k-.6)*1.2);cx.font='900 '+s+'px sans-serif';cx.lineWidth=5;cx.strokeStyle='#3a1000';cx.strokeText(n.t,n.x,n.y);cx.fillStyle=n.c;cx.fillText(n.t,n.x,n.y);}
 cx.globalAlpha=1;}
function rr(x,y,w,h,r){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h);}
function drawSword(x,y,d,size,grid,ang){const c=swordCanvas(d);const h=size,w=h/2;cx.save();cx.translate(x,y);cx.rotate(ang!=null?ang:d*Math.PI/2);
 if(grid){cx.globalCompositeOperation='lighter';cx.globalAlpha=.25;cx.fillStyle=COL[d][0];cx.beginPath();cx.ellipse(0,0,w*.32,h*.42,0,0,7);cx.fill();cx.globalAlpha=1;cx.globalCompositeOperation='source-over';}
 cx.drawImage(c,-w/2,-h*.5,w,h);cx.restore();}
// ---------- flow / ads
function ad(cb){const o=$('adov');o.classList.add('on');paused=true;let n=3;$('adCnt').textContent=n;const iv=setInterval(()=>{n--;$('adCnt').textContent=n;if(n<=0){clearInterval(iv);o.classList.remove('on');paused=false;last=performance.now();cb();}},1000);}
function addSix(){let added=0;const cells=[];for(let r=L.rows-1;r>=0;r--)for(let c=0;c<L.cols;c++)if(G.grid[r][c]<0)cells.push([c,r]);cells.sort(()=>Math.random()-.5);
 for(const [c,r] of cells){if(added>=6)break;const o=[0,1].filter(d=>clearPath(G.grid,c,r,d));const d=o.length?o[Math.random()*o.length|0]:[2,3].find(d=>clearPath(G.grid,c,r,d));if(d==null)continue;G.grid[r][c]=d;added++;
  const [x,y]=cellXY(c,r);for(let i=0;i<10;i++)G.fx.push({x,y,vx:rnd(-120,120),vy:rnd(-120,120),l:.5,ml:.5,c:COL[d][0],r:4});}
 toast('+'+added+' 飞剑！',900,'#fff3a0');ui();}
$('adBtn').onclick=()=>{if(!G||G.over)return;ad(addSix);};
function gameOver(){G.over=true;const sc=G.wave;if(sc>best){best=sc;safeSet('fj_best',best);}$('overT').textContent='村口失守！';$('overS').innerHTML='坚守到 <b>第 '+G.wave+' 波</b> · 击败 '+G.kills+' 只<br>最高纪录：第 '+best+' 波';$('revBtn').style.display=G.revived?'none':'block';$('over').classList.add('on');}
$('revBtn').onclick=()=>ad(()=>{G.revived=true;G.over=false;G.lives=3;for(const e of G.en)e.s=Math.min(e.s,L.seg1*.3);addSix();$('over').classList.remove('on');ui();});
$('again').onclick=()=>{$('over').classList.remove('on');newGame();};
$('startBtn').onclick=()=>{$('home').classList.remove('on');newGame();};
$('setBtn').onclick=()=>{if(G&&!G.over){paused=true;$('menu').classList.add('on');}};
$('resume').onclick=()=>{paused=false;last=performance.now();$('menu').classList.remove('on');};
$('restart').onclick=()=>{$('menu').classList.remove('on');paused=false;newGame();};
$('toHome').onclick=()=>{$('menu').classList.remove('on');paused=false;G=null;$('home').classList.add('on');};
$('best').textContent=best?'最高纪录：第 '+best+' 波':'';
window.__fj={get G(){return G},nextWave,cellXY,L,solveCheck,genGrid};
requestAnimationFrame(step);
</script></body></html>
